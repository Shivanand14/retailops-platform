name: CI/CD — RetailOps Platform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint-test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [order-service, payment-service, inventory-service, user-service]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 black pytest httpx
          python -m pip install -r services/${{ matrix.service }}/requirements.txt

      - name: Lint with flake8
        working-directory: services/${{ matrix.service }}
        run: flake8 app/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Check formatting with black
        working-directory: services/${{ matrix.service }}
        run: black --check app/ tests/

      - name: Run API tests
        working-directory: services/${{ matrix.service }}
        run: pytest tests/ -v

  validate-charts:
    name: Validate Helm charts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint and render all charts
        run: |
          for service in order-service payment-service inventory-service user-service; do
            helm lint "deployments/helm/${service}/"
            helm template "${service}" "deployments/helm/${service}/" --namespace retailops > /dev/null
          done

  build-push:
    name: Build ${{ matrix.service }} image
    needs: [lint-test, validate-charts]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [order-service, payment-service, inventory-service, user-service]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=pr
          flavor: |
            suffix=-${{ matrix.service }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
