global:
  smtp_smarthost: "localhost:25"
  smtp_from: "alerts@retailops.local"
  slack_api_url: "https://hooks.slack.com/services/YOUR/WEBHOOK/URL"

route:
  group_by: ['alertname', 'service', 'severity']
  group_wait: 30s
  group_interval: 1m
  repeat_interval: 4h
  receiver: 'team-sre'
  routes:
    - match:
        severity: critical
      receiver: 'team-sre-critical'
      continue: true
    - match:
        severity: warning
      receiver: 'team-sre-warning'

receivers:
  - name: 'team-sre'
    email:
      - to: 'sre-team@retailops.local'

  - name: 'team-sre-critical'
    email:
      - to: 'sre-oncall@retailops.local'
    slack:
      channel: '#sre-critical'
      title: '[CRITICAL] RetailOps Alert'
      text: '{{ range .Alerts }}{{ .Annotations.summary }}: {{ .Annotations.description }}{{ end }}'

  - name: 'team-sre-warning'
    email:
      - to: 'sre-team@retailops.local'
    slack:
      channel: '#sre-warnings'
      title: '[WARNING] RetailOps Alert'
      text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service']
