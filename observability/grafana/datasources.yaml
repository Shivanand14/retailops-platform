apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
    isDefault: true
    editable: true

  - name: Loki
    type: loki
    access: proxy
    url: http://loki.monitoring.svc:3100
    editable: true

  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo.monitoring.svc:3100
    editable: true
