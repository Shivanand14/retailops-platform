groups:
  - name: retailops-slo-alerts
    rules:
    # --- Availability SLO Alerts ---
    - alert: OrderServiceAvailabilityBelowSLO
      expr: |
        100 * sum(rate(http_requests_total{service="order-service",status!~"5.."}[1m]))
        /
        sum(rate(http_requests_total{service="order-service"}[1m])) < 99.9
      for: 5m
      labels:
        severity: critical
        service: order-service
        slo_type: availability
      annotations:
        summary: "Order service availability below 99.9% SLO"
        description: "Order service availability is {{ $value }}% over the last 5 minutes, below the 99.9% SLO."
        runbook: "https://github.com/yourname/retailops-platform/blob/main/docs/runbooks/service-availability.md"

    - alert: PaymentServiceAvailabilityBelowSLO
      expr: |
        100 * sum(rate(http_requests_total{service="payment-service",status!~"5.."}[1m]))
        /
        sum(rate(http_requests_total{service="payment-service"}[1m])) < 99.9
      for: 5m
      labels:
        severity: critical
        service: payment-service
        slo_type: availability
      annotations:
        summary: "Payment service availability below 99.9% SLO"
        description: "Payment service availability is {{ $value }}% over the last 5 minutes."

    # --- Latency SLO Alerts ---
    - alert: OrderServiceHighLatency
      expr: |
        histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{service="order-service"}[1m])) by (le)) * 1000 > 200
      for: 10m
      labels:
        severity: warning
        service: order-service
        slo_type: latency
      annotations:
        summary: "Order service p95 latency above 200ms"
        description: "p95 latency is {{ $value }}ms, exceeding the 200ms SLO target."

    # --- Error Rate Alerts ---
    - alert: HighErrorRate
      expr: |
        100 * sum(rate(http_requests_total{status=~"5.."}[1m])) by (service)
        /
        sum(rate(http_requests_total[1m])) by (service) > 5
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "High error rate detected on {{ $labels.service }}"
        description: "{{ $labels.service }} has a 5xx error rate of {{ $value }}% over the last 2 minutes."

    # --- Infrastructure Alerts ---
    - alert: PodCrashLooping
      expr: |
        kube_pod_container_status_restarts_total{pod!=""} > 0
      for: 3m
      labels:
        severity: warning
      annotations:
        summary: "Pod {{ $labels.pod }} is crash looping"
        description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has restarted {{ $value }} times."

    - alert: HighCPUUsage
      expr: |
        sum(rate(container_cpu_usage_seconds_total[1m])) by (pod) / sum(kube_pod_container_resource_requests_cpu_cores) by (pod) > 0.85
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High CPU usage on pod {{ $labels.pod }}"
        description: "Pod {{ $labels.pod }} is using {{ $value | humanizePercentage }} of its CPU request."

  - name: retailops-infra-alerts
    rules:
    - alert: NodeDiskPressure
      expr: |
        node_filesystem_avail_bytes{fstype!~"tmpfs|fuse.*"} / node_filesystem_size_bytes{fstype!~"tmpfs|fuse.*"} < 0.10
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Node disk pressure on {{ $labels.node }}"
        description: "Node {{ $labels.node }} has less than 10% disk space available."
